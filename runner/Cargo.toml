[package]
name = "oxidebot_app"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "Personal Telegram OxideBot with China Unicom usage monitoring"
publish = false

[dependencies]
telegram_bot_oxidebot = { version = "0.1.4", git = "https://github.com/canxin121/telegram_bot_oxidebot" }
oxidebot = "0.1.8"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
china_unicom_oxidebot = { version = "0.3.0", git = "https://github.com/canxin121/china_unicom_oxidebot" }

[profile.release]
lto = true
strip = true
opt-level = "z"   # Optimize for size.
codegen-units = 1
panic = "abort"
