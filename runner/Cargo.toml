[package]
name = "oxidebot_app"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Personal Telegram OxideBot with China Unicom usage monitoring"
publish = false

[dependencies]
anyhow = "1.0.104"
china_unicom_oxidebot = { git = "https://github.com/canxin121/china_unicom_oxidebot", rev = "509c10ca83a95af8655ac27f6da6a3d79ccf734c", version = "1.0.0" }
oxidebot = { git = "https://github.com/canxin121/oxidebot", rev = "5a867139a12b716c54d2464c9fe7d2ca8af7e8ed", version = "1.0.0" }
oxidebot-adapter-telegram = { git = "https://github.com/canxin121/oxidebot", rev = "5a867139a12b716c54d2464c9fe7d2ca8af7e8ed", version = "1.0.0" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
strip = true
opt-level = "z"   # Optimize for size.
codegen-units = 1
panic = "abort"
